<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOU FOUND IT — Rock'n'Rolla</title>
    <link rel="icon" type="image/png" href="images/faviconadmin.png">

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: #080808;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .room {
            width: 100%;
            max-width: 700px;
            text-align: center;
            background: #151515;
            border: 1px solid #ff9d00;
            border-radius: 16px;
            padding: 40px 25px;
            box-shadow: 0 0 45px #ff9d0022;
            animation: appear .7s ease;
        }

        @keyframes appear {
            from { opacity: 0; transform: scale(.94); }
            to { opacity: 1; transform: scale(1); }
        }

        .icon {
            font-size: 55px;
            margin-bottom: 10px;
        }

        h1 {
            color: #ff9d00;
            font-size: clamp(28px, 6vw, 48px);
            margin: 10px 0;
            letter-spacing: 3px;
        }

        .subtitle {
            color: #aaa;
            line-height: 1.6;
        }

        .message {
            margin: 30px 0;
            padding: 25px;
            background: #202020;
            border-radius: 10px;
            border: 1px solid #333;
        }

        .message p {
            font-size: 19px;
            line-height: 1.5;
        }

        .meme-image {
            display: block;
            width: 100%;
            max-width: 600px;
            max-height: 530px;
            object-fit: contain;
            margin: 20px auto 0;
            border-radius: 10px;
            border: 1px solid #444;
            box-shadow: 0 0 20px #ff9d0018;
        }

        button {
            background: #ff9d00;
            color: #111;
            border: none;
            border-radius: 7px;
            padding: 14px 22px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover { background: #ffb52e; }

        .small {
            margin-top: 25px;
            color: #666;
            font-size: 12px;
        }

        @media(max-width: 600px) {
            .room { padding: 30px 18px; }
            .message { padding: 18px; }
        }
    </style>
</head>

<body>

<div class="room">
    <div class="icon"></div>

    <h1>YOU FOUND IT</h1>

    <p class="subtitle">
        Добро пожаловать в секретную комнату Rock'n'Rolla.
        Сюда попадают только самые любопытные.
    </p>

    <div class="message">
        <p id="randomMessage">Загрузка секретного сообщения...</p>

        <img
            id="memeImage"
            class="meme-image"
            src=""
            alt="Секретный мем"
            hidden
        >
    </div>

    <button onclick="location.href='dashboard.html'">
        ВЕРНУТЬСЯ В АДМИНКУ
    </button>

    <div class="small">
        
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>

<script>
    async function checkAccess() {
        const { data, error } = await supabaseClient.auth.getUser();

        if (error || !data.user) {
            window.location.href = "admin.html";
            return;
        }

        const { data: profile, error: profileError } =
            await supabaseClient
                .from("profiles")
                .select("role")
                .eq("user_id", data.user.id)
                .single();

        if (profileError || !profile ||
            !["owner", "admin", "editor"].includes(profile.role)) {
            window.location.href = "admin.html";
            return;
        }

        const messages = [
            {
                text: "Раз в 30 минут вставайте на 2 минуты, либо раз в час — на 5 минут",
                image: "images/secret-meme-1.jpg"
            },
            {
                text: "Секретных данных нет. Но раз уж ты зашел так далеко — самое время расправить плечи, выпить воды и отойти от монитора на 5 минут.",
                image: "images/secret-meme-2.jpg"
            },
            {
                text: "Всё работает... Удивительно",
                image: "images/secret-meme-3.jpg"
            },
            {
                text: "Здесь мог быть важный функционал. Но его тут нет",
                image: "images/secret-meme-4.jpg"
            },
            {
                text: "Поздравляю! Ты нашёл то, чего никто не искал.",
                image: "images/secret-meme-5.jpg"
            }
        ];

        const random = Math.floor(Math.random() * messages.length);
        const selected = messages[random];

        document.getElementById("randomMessage").textContent =
            selected.text;

        const memeImage = document.getElementById("memeImage");

        memeImage.src = selected.image;
        memeImage.hidden = false;

        memeImage.onerror = function() {
            memeImage.hidden = true;
            console.error("Не удалось загрузить картинку:", selected.image);
        };
    }

    checkAccess();
</script>

</body>
</html>
