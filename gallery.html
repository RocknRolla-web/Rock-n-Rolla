<script>
const mainMenuButton = document.getElementById("mainMenuButton");
const mainDropdown = document.getElementById("mainDropdown");

mainMenuButton.addEventListener("click", function(event) {
    event.stopPropagation();
    mainDropdown.classList.toggle("open");
    mainMenuButton.setAttribute(
        "aria-expanded",
        mainDropdown.classList.contains("open")
    );
});

document.addEventListener("click", function(event) {
    if (!event.target.closest(".nav-dropdown")) {
        mainDropdown.classList.remove("open");
        mainMenuButton.setAttribute("aria-expanded", "false");
    }
});

document.addEventListener("keydown", function(event) {
    if (event.key === "Escape") {
        mainDropdown.classList.remove("open");
        mainMenuButton.setAttribute("aria-expanded", "false");
    }
});
</script>
