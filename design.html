<!DOCTYPE html>
<html lang="ru">
<head>
<link rel="icon" type="image/png" href="images/faviconadmin.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock'n'Rolla — Оформление</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0b0b0b;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        header {
            padding: 22px 5%;
            background: #151515;
            border-bottom: 2px solid #ff9d00;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        header h1 {
            color: #ff9d00;
            font-size: 22px;
            margin: 0;
        }

        button, select {
            padding: 12px 16px;
            border: 1px solid #444;
            border-radius: 7px;
            font-weight: bold;
            cursor: pointer;
        }

        button {
            background: #ff9d00;
            color: #111;
        }

        .back {
            background: #252525;
            color: white;
            text-decoration: none;
            padding: 12px 16px;
            border-radius: 7px;
        }

        main {
            width: 90%;
            max-width: 850px;
            margin: 35px auto;
        }

        .panel {
            background: #171717;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
        }

        h2 {
            color: #ff9d00;
            margin-top: 0;
        }

        .option {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding: 17px 0;
            border-bottom: 1px solid #333;
        }

        .option:last-child {
            border-bottom: none;
        }

        .description {
            color: #aaa;
            font-size: 14px;
            line-height: 1.5;
            margin-top: 5px;
        }

        input[type="checkbox"] {
            width: 22px;
            height: 22px;
            accent-color: #ff9d00;
            cursor: pointer;
        }

        select {
            background: #252525;
            color: white;
            min-width: 180px;
        }

        .save {
            width: 100%;
            margin-top: 20px;
            font-size: 16px;
        }

        #message {
            margin-top: 18px;
            color: #ffbd4a;
            line-height: 1.5;
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
                align-items: flex-start;
            }

            .option {
                align-items: flex-start;
            }

            select {
                min-width: 130px;
                max-width: 150px;
            }

            .panel {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>ROCK'N'ROLLA — ОФОРМЛЕНИЕ</h1>
    <a href="dashboard.html" class="back">← В панель</a>
</header>

<main>
    <section class="panel">
        <h2>Праздничное оформление</h2>
        <p class="description">
            Выбери тему, которая будет отображаться у всех посетителей сайта.
        </p>

        <div class="option">
            <div>
                <strong>Тема сайта</strong>
                <div class="description">Выбери оформление Rock'n'Rolla</div>
            </div>

           <select id="themeSelect">
                <option value="classic"> Классическая</option>
    		<option value="christmas"> Новый год</option>
    		<option value="march8"> 8 марта</option>
    		<option value="birthday"> День рождения</option>
	   </select>
        </div>

        <div class="option">
            <div>
                <strong>Снегопад</strong>
                <div class="description">
                    Включить падающие снежинки на сайте
                </div>
            </div>

            <input type="checkbox" id="effectsToggle">
        </div>

        <button class="save" id="saveBtn">
            СОХРАНИТЬ ИЗМЕНЕНИЯ
        </button>

        <p id="message">Загрузка настроек...</p>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>

<script>
    const themeSelect = document.getElementById("themeSelect");
    const effectsToggle = document.getElementById("effectsToggle");
    const saveBtn = document.getElementById("saveBtn");
    const message = document.getElementById("message");

    async function checkAccess() {
        const { data: userData, error: userError } =
            await supabaseClient.auth.getUser();

        if (userError || !userData.user) {
            window.location.href = "admin.html";
            return false;
        }

        const { data: profile, error: profileError } =
            await supabaseClient
                .from("profiles")
                .select("role")
                .eq("user_id", userData.user.id)
                .single();

        if (
            profileError ||
            !profile ||
            !["owner", "admin", "editor"].includes(profile.role)
        ) {
            message.textContent = "Нет доступа к панели управления.";
            return false;
        }

        const { data: assurance, error: assuranceError } =
            await supabaseClient.auth.mfa.getAuthenticatorAssuranceLevel();

        if (
            assuranceError ||
            !assurance ||
            assurance.currentLevel !== "aal2"
        ) {
            message.textContent =
                "Для управления оформлением необходимо подтвердить вход по 2FA.";
            setTimeout(() => {
                window.location.href = "admin.html";
            }, 1800);
            return false;
        }

        return true;
    }

    async function loadSettings() {
        const allowed = await checkAccess();
        if (!allowed) return;

        const { data, error } = await supabaseClient
            .from("site_settings")
            .select("active_theme, effects_enabled")
            .eq("id", 1)
            .single();

        if (error) {
            message.textContent = "Ошибка загрузки: " + error.message;
            return;
        }

        themeSelect.value = data.active_theme;
        effectsToggle.checked = data.effects_enabled;

        message.textContent = "Настройки загружены.";
    }

    saveBtn.addEventListener("click", async () => {
        saveBtn.disabled = true;
        message.textContent = "Сохраняем...";

        const allowed = await checkAccess();

        if (!allowed) {
            saveBtn.disabled = false;
            return;
        }

        const { error } = await supabaseClient
            .from("site_settings")
            .update({
                active_theme: themeSelect.value,
                effects_enabled: effectsToggle.checked,
                updated_at: new Date().toISOString()
            })
            .eq("id", 1);

        saveBtn.disabled = false;

        if (error) {
            message.textContent = "Ошибка сохранения: " + error.message;
            return;
        }

        message.textContent = "Изменения успешно сохранены!";
    });

    loadSettings();
</script>

</body>
</html>
